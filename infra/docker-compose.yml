version: '3.8'

# ── Groq API key is loaded from infra/.env ───────────────────────────────────
# Create infra/.env with:  GROQ_API_KEY=gsk_xxxxxxxxxxxxxxxxxxxx
# ─────────────────────────────────────────────────────────────────────────────

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "2181:2181"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../collector/otelcol-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - observability
    environment:
      GOGC: 80

  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "3000:3000"
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PORT: 3000
      ORDER_SERVICE_URL: http://order-service:5000
      PAYMENT_SERVICE_URL: http://payment-service:3001
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ../services/order-service
    ports:
      - "5000:5000"
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PORT: 5000
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ../services/payment-service
    ports:
      - "3001:3001"
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      SERVICE_NAME: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PORT: 3001
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-consumer:
    build:
      context: ../kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      BATCH_SIZE: 100
      FLUSH_INTERVAL: 5000
    networks:
      - observability

  query-api:
    build:
      context: ../query-api
    ports:
      - "4000:4000"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      CACHE_TTL: 30
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  trace-analyser:
    build:
      context: ../query-api/workers
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY}      # loaded from infra/.env
      GROQ_MODEL: llama3-8b-8192          # free model on Groq
      ANALYSIS_INTERVAL: 60000
    networks:
      - observability

  dashboard:
    build:
      context: ../dashboard
    ports:
      - "8080:3000"   # Dashboard on 8080 — api-gateway occupies 3000
    depends_on:
      query-api:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://localhost:4000
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  clickhouse_data:
